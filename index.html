
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Calculadora DIFAL - Amapá</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      background-color: #f2f2f2;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    h2, h3 {
      text-align: center;
      color: #014421;
    }
    .bandeira {
      display: block;
      margin: 0 auto 20px auto;
      width: 120px;
    }
    label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }
    button {
      padding: 12px;
      margin-top: 20px;
      width: 100%;
      background-color: #014421;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #026c32;
    }
    pre {
      background: #fff;
      padding: 10px;
      margin-top: 20px;
      white-space: pre-wrap;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .formula {
      display: block;
      margin: 0 auto 20px auto;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <img src="https://upload.wikimedia.org/wikipedia/commons/0/0c/Bandeira_do_Amap%C3%A1.svg" alt="Bandeira do Amapá" class="bandeira">
  <h2>Calculadora DIFAL - ICMS (Amapá)</h2>

  <label>Total da Nota (R$):</label>
  <input type="number" step="0.01" id="total_nota" placeholder="Ex: 2000.00">

  <label>ICMS Origem (R$):</label>
  <input type="number" step="0.01" id="icms_origem" placeholder="Ex: 200.00">

  <label>Alíquota Interna no Amapá (%):</label>
  <select id="aliq_interna">
    <option value="0.29">29%</option>
    <option value="0.25">25%</option>
    <option value="0.18" selected>18%</option>
    <option value="0.17">17%</option>
    <option value="0.12">12%</option>
	<option value="0.04">4%</option>
  </select>

  <label>Estado de Origem:</label>
  <select id="estado_origem">
    <option value="AC">Acre (AC)</option>
    <option value="AL">Alagoas (AL)</option>
    <option value="AP">Amapá (AP)</option>
    <option value="AM">Amazonas (AM)</option>
    <option value="BA">Bahia (BA)</option>
    <option value="CE">Ceará (CE)</option>
    <option value="DF">Distrito Federal (DF)</option>
    <option value="ES">Espírito Santo (ES)</option>
    <option value="GO">Goiás (GO)</option>
    <option value="MA">Maranhão (MA)</option>
    <option value="MT">Mato Grosso (MT)</option>
    <option value="MS">Mato Grosso do Sul (MS)</option>
    <option value="MG">Minas Gerais (MG)</option>
    <option value="PA">Pará (PA)</option>
    <option value="PB">Paraíba (PB)</option>
    <option value="PR">Paraná (PR)</option>
    <option value="PE">Pernambuco (PE)</option>
    <option value="PI">Piauí (PI)</option>
    <option value="RJ">Rio de Janeiro (RJ)</option>
    <option value="RN">Rio Grande do Norte (RN)</option>
    <option value="RS">Rio Grande do Sul (RS)</option>
    <option value="RO">Rondônia (RO)</option>
    <option value="RR">Roraima (RR)</option>
    <option value="SC">Santa Catarina (SC)</option>
    <option value="SP">São Paulo (SP)</option>
    <option value="SE">Sergipe (SE)</option>
    <option value="TO">Tocantins (TO)</option>
  </select>

  <button onclick="calcular()">Calcular DIFAL</button>

  <pre id="resultado"></pre>

  <script>
    function calcular() {
      const vOper = parseFloat(document.getElementById('total_nota').value);
      const icmsOrigem = parseFloat(document.getElementById('icms_origem').value);
      const aliqInt = parseFloat(document.getElementById('aliq_interna').value);
      const estadoOrigem = document.getElementById('estado_origem').value;
      const sulSudesteExcetoES = ['SP', 'RJ', 'MG', 'PR', 'SC', 'RS'];
      const aliqInter = sulSudesteExcetoES.includes(estadoOrigem) ? 0.07 : 0.12;

      if (
        isNaN(vOper) || vOper <= 0 ||
        isNaN(icmsOrigem) || icmsOrigem < 0 ||
        isNaN(aliqInt) || aliqInt <= 0
      ) {
        alert('⚠️ Preencha todos os campos com valores válidos acima de zero.');
        return;
      }

      const baseICMS = (vOper - icmsOrigem) / (1 - aliqInt);
      const icmsInterno = baseICMS * aliqInt;
      const icmsInter = vOper * aliqInter;
      const difal = icmsInterno - icmsInter;

      let resultado = `*** MEMÓRIA DE CÁLCULO DO DIFAL ***\n\n`;
      resultado += `Fórmula Aplicada:\n`;
      resultado += `DIFAL = [(vOper - ICMS_Origem) / (1 - ALQ_Interna)] × ALQ_Interna - (vOper × ALQ_Interestadual)\n\n`;

      resultado += `A) Valor da Operação (vOper):              R$ ${vOper.toFixed(2)}\n`;
      resultado += `B) ICMS destacado na origem:               R$ ${icmsOrigem.toFixed(2)}\n`;
      resultado += `C) Alíquota Interna no AP:                 ${(aliqInt * 100).toFixed(2)}%\n`;
      resultado += `D) Alíquota Interestadual:                 ${(aliqInter * 100).toFixed(2)}%\n\n`;

      resultado += `E) Base de Cálculo Ajustada ([(A - B)/(1 - C)]): R$ ${baseICMS.toFixed(2)}\n`;
      resultado += `F) ICMS destino (E × C):                        R$ ${icmsInterno.toFixed(2)}\n`;
      resultado += `G) ICMS interestadual (A × D):                 R$ ${icmsInter.toFixed(2)}\n`;
      resultado += `H) DIFAL A RECOLHER (F - G):                   R$ ${difal.toFixed(2)}\n\n`;

      resultado += `Expressão Literal Final:\n`;
      resultado += `DIFAL = [(A - B) / (1 - C)] × C - (A × D)\n\n`;

      resultado += `Fundamento legal: RICMS/AP, Anexo I, Art. 25 - Memorando nº 045/COTRI/SRE.\n`;

      document.getElementById('resultado').innerHTML =
        '<img class="formula" src="fbe8bffa-78a9-4225-a1b8-e1bf0a382c75.png" alt="Fórmula DIFAL"><br>' + resultado;
    }
  </script>
</body>
</html>
