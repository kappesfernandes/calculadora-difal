<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Calculadora DIFAL - Amapá</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      background-color: #f2f2f2;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    h2 {
      text-align: center;
      color: #014421;
    }
    .bandeira {
      display: block;
      margin: 0 auto 20px auto;
      width: 120px;
    }
    label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }
    button {
      padding: 12px;
      margin-top: 20px;
      width: 100%;
      background-color: #014421;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #026c32;
    }
    pre {
      background: #fff;
      padding: 10px;
      margin-top: 20px;
      white-space: pre-wrap;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <img src="https://upload.wikimedia.org/wikipedia/commons/0/0c/Bandeira_do_Amap%C3%A1.svg" alt="Bandeira do Amapá" class="bandeira">
  <h2>Calculadora DIFAL - ICMS (Amapá)</h2>

  <label>Total da Nota (R$):</label>
  <input type="number" step="0.01" id="total_nota" placeholder="Ex: 2000.00">

  <label>ICMS Origem (R$):</label>
  <input type="number" step="0.01" id="icms_origem" placeholder="Ex: 200.00">

  <label>Alíquota Interna (%):</label>
  <input type="number" step="0.01" id="aliq_interna" placeholder="Ex: 18">

  <label>Alíquota Interestadual (%):</label>
  <select id="aliq_inter">
    <option value="0.04">4%</option>
    <option value="0.07" selected>7%</option>
    <option value="0.12">12%</option>
  </select>

  <button onclick="calcular()">Calcular DIFAL</button>

  <pre id="resultado"></pre>

  <script>
    function calcular() {
      const vOper = parseFloat(document.getElementById('total_nota').value);
      const icmsOrigem = parseFloat(document.getElementById('icms_origem').value);
      const aliqInt = parseFloat(document.getElementById('aliq_interna').value) / 100;
      const aliqInter = parseFloat(document.getElementById('aliq_inter').value);

      if (
        isNaN(vOper) || vOper <= 0 ||
        isNaN(icmsOrigem) || icmsOrigem < 0 ||
        isNaN(aliqInt) || aliqInt <= 0 ||
        isNaN(aliqInter) || aliqInter <= 0
      ) {
        alert('⚠️ Preencha todos os campos com valores válidos acima de zero.');
        return;
      }

      const difal = ((vOper - icmsOrigem) / (1 - aliqInt)) * aliqInt - (vOper * aliqInter);

      let resultado = `*** Memória de Cálculo ***\n\n`;
      resultado += `Valor da Operação:       R$ ${vOper.toFixed(2)}\n`;
      resultado += `ICMS Origem:             R$ ${icmsOrigem.toFixed(2)}\n`;
      resultado += `Alíquota Interna:        ${(aliqInt * 100).toFixed(2)}%\n`;
      resultado += `Alíquota Interestadual:  ${(aliqInter * 100).toFixed(2)}%\n\n`;
      resultado += `DIFAL Calculado:         R$ ${difal.toFixed(2)}\n`;

      document.getElementById('resultado').innerText = resultado;
    }
  </script>
</body>
</html>
